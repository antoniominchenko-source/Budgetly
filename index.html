<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Мой бюджет</title>
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="mobile-web-app-capable" content="true" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Бюджет" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
 
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
 
    :root {
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #f0f0f0;
      --text2: #888;
      --text3: #555;
      --green: #4ade80;
      --green-bg: rgba(74,222,128,0.1);
      --green-border: rgba(74,222,128,0.25);
      --red: #f87171;
      --red-bg: rgba(248,113,113,0.1);
      --red-border: rgba(248,113,113,0.25);
      --blue: #60a5fa;
      --radius: 12px;
      --radius-sm: 8px;
    }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
    }
 
    /* AUTH SCREEN */
    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }
    .auth-icon {
      width: 72px; height: 72px;
      background: var(--bg2);
      border-radius: 20px;
      border: 0.5px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    .auth-title { font-size: 24px; font-weight: 600; text-align: center; }
    .auth-sub { font-size: 14px; color: var(--text2); text-align: center; line-height: 1.5; }
    .google-btn {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg2); border: 0.5px solid var(--border2);
      border-radius: var(--radius); padding: 14px 24px;
      font-size: 15px; font-weight: 500; color: var(--text);
      cursor: pointer; transition: background 0.15s;
      width: 100%;  justify-content: center;
    }
    .google-btn:active { background: var(--bg3); }
    .google-btn svg { flex-shrink: 0; }
 
    /* MAIN APP */
    #app-screen { display: none; flex-direction: column; flex: 1; }
 
    .topbar {
      padding: 16px 20px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 0.5px solid var(--border);
    }
    .topbar-title { font-size: 17px; font-weight: 600; }
    .user-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg3); border: 0.5px solid var(--border2);
      cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--text2);
    }
    .user-btn img { width: 100%; height: 100%; object-fit: cover; }
 
    .scroll-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
 
    /* TYPE TOGGLE */
    .type-toggle {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--bg2); border-radius: var(--radius);
      padding: 4px; gap: 4px;
      border: 0.5px solid var(--border);
    }
    .type-opt {
      padding: 10px; border-radius: var(--radius-sm);
      text-align: center; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; color: var(--text2);
    }
    .type-opt.active-expense { background: var(--red-bg); color: var(--red); border: 0.5px solid var(--red-border); }
    .type-opt.active-income { background: var(--green-bg); color: var(--green); border: 0.5px solid var(--green-border); }
 
    /* AMOUNT */
    .amount-wrap {
      background: var(--bg2); border-radius: var(--radius);
      border: 0.5px solid var(--border); padding: 16px 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .amount-currency { font-size: 22px; color: var(--text2); font-weight: 300; }
    .amount-input {
      flex: 1; background: none; border: none; outline: none;
      font-size: 32px; font-weight: 600; color: var(--text);
      width: 100%;
    }
    .amount-input::placeholder { color: var(--text3); }
 
    /* SECTION */
    .section-label { font-size: 12px; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
 
    /* CATEGORIES */
    .cat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cat-btn {
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px;
      font-size: 13px; color: var(--text2); cursor: pointer;
      transition: all 0.15s; text-align: left;
      display: flex; align-items: center; gap: 6px;
    }
    .cat-btn .cat-icon { font-size: 15px; }
    .cat-btn.selected { background: var(--bg3); border-color: var(--border2); color: var(--text); }
 
    /* INPUTS */
    .text-input {
      width: 100%; background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius); padding: 13px 16px;
      font-size: 15px; color: var(--text); outline: none;
      transition: border-color 0.15s;
    }
    .text-input::placeholder { color: var(--text3); }
    .text-input:focus { border-color: var(--border2); }
 
    /* PAYMENT */
    .payment-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .pay-btn {
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 8px;
      font-size: 12px; color: var(--text2); cursor: pointer;
      transition: all 0.15s; text-align: center;
    }
    .pay-btn.selected { background: var(--bg3); border-color: var(--border2); color: var(--text); }
 
    /* SUBMIT */
    .submit-wrap { padding: 0 20px 32px; }
    .submit-btn {
      width: 100%; padding: 16px;
      border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; position: relative;
    }
    .submit-btn.expense { background: var(--red); color: #0f0f0f; }
    .submit-btn.income { background: var(--green); color: #0f0f0f; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
 
    /* TOAST */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg3); border: 0.5px solid var(--border2);
      padding: 10px 20px; border-radius: 100px;
      font-size: 14px; color: var(--text);
      opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green-border); color: var(--green); }
    .toast.error { border-color: var(--red-border); color: var(--red); }
 
    /* NAV */
    .bottom-nav {
      border-top: 0.5px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr;
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px; cursor: pointer; color: var(--text3); font-size: 10px;
      transition: color 0.15s;
    }
    .nav-btn.active { color: var(--blue); }
    .nav-btn svg { width: 22px; height: 22px; }
 
    /* HISTORY SCREEN */
    #history-screen { display: none; flex: 1; flex-direction: column; }
    .history-list { flex: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .h-icon { font-size: 20px; }
    .h-info { flex: 1; }
    .h-name { font-size: 14px; font-weight: 500; }
    .h-cat { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .h-amount { font-size: 16px; font-weight: 600; }
    .h-amount.exp { color: var(--red); }
    .h-amount.inc { color: var(--green); }
    .history-empty { text-align: center; color: var(--text2); font-size: 14px; padding: 3rem; }
  </style>
</head>
<body>
 
<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-icon">💰</div>
  <div>
    <div class="auth-title">Мой бюджет</div>
    <div class="auth-sub" style="margin-top:8px">Войди через Google чтобы записи<br>сохранялись в твою таблицу</div>
  </div>
  <button class="google-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
    Войти через Google
  </button>
  <div id="auth-error" style="font-size:13px;color:var(--red);text-align:center;display:none"></div>
</div>
 
<!-- APP -->
<div id="app-screen">
  <div id="add-view" style="display:flex;flex-direction:column;flex:1;">
    <div class="topbar">
      <div class="topbar-title">Добавить</div>
      <div class="user-btn" id="user-avatar" onclick="signOut()">А</div>
    </div>
    <div class="scroll-area">
 
      <!-- TYPE -->
      <div class="type-toggle">
        <div class="type-opt active-expense" id="opt-expense" onclick="setType('Расход')">— Расход</div>
        <div class="type-opt" id="opt-income" onclick="setType('Доход')">+ Доход</div>
      </div>
 
      <!-- AMOUNT -->
      <div>
        <div class="section-label">Сумма</div>
        <div class="amount-wrap">
          <span class="amount-currency">₴</span>
          <input class="amount-input" id="amount" type="number" inputmode="decimal" placeholder="0" />
        </div>
      </div>
 
      <!-- CATEGORY -->
      <div>
        <div class="section-label">Категория</div>
        <div class="cat-grid" id="cat-grid"></div>
      </div>
 
      <!-- DESCRIPTION -->
      <div>
        <div class="section-label">Описание</div>
        <input class="text-input" id="desc" type="text" placeholder="Необязательно" />
      </div>
 
      <!-- PAYMENT -->
      <div>
        <div class="section-label">Способ оплаты</div>
        <div class="payment-grid">
          <div class="pay-btn selected" onclick="setPayment('Карта')">💳 Карта</div>
          <div class="pay-btn" onclick="setPayment('Наличные')">💵 Наличные</div>
          <div class="pay-btn" onclick="setPayment('Банковский перевод')">🏦 Перевод</div>
        </div>
      </div>
 
      <div style="height:8px"></div>
    </div>
    <div class="submit-wrap">
      <button class="submit-btn expense" id="submit-btn" onclick="submitEntry()">Добавить расход</button>
    </div>
  </div>
 
  <!-- HISTORY VIEW -->
  <div id="history-view" style="display:none;flex-direction:column;flex:1;">
    <div class="topbar">
      <div class="topbar-title">История</div>
      <div style="font-size:12px;color:var(--text2)" id="history-count"></div>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>
 
  <!-- NAV -->
  <div class="bottom-nav">
    <div class="nav-btn active" id="nav-add" onclick="showView('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Добавить
    </div>
    <div class="nav-btn" id="nav-hist" onclick="showView('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
      История
    </div>
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script>
  const SHEET_ID = '1zG-PlP8ORyqz036hfjHDbH-thBda1JdZ2OPH1QaYqig';
  const CLIENT_ID = '330349583357-kb7inj4ctcs5gnvdfpf9ktkeftrco36n.apps.googleusercontent.com'; // ← заменить
  const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
 
  const CATEGORIES = {
    'Расход': [
      { name: 'Жильё и услуги', icon: '🏠' },
      { name: 'Техника', icon: '💻' },
      { name: 'Транспорт', icon: '🚗' },
      { name: 'Еда', icon: '🛒' },
      { name: 'Вкусности', icon: '☕' },
      { name: 'Помощь / переводы', icon: '🤝' },
      { name: 'Развлечения', icon: '🎮' },
      { name: 'Кредиты', icon: '💳' },
      { name: 'Одежда', icon: '👕' },
      { name: 'Здоровье и спорт', icon: '💊' },
      { name: 'Быт / дом', icon: '🧹' },
      { name: 'Сбережения', icon: '🏦' },
      { name: 'Непредвиденные расходы', icon: '⚡' },
    ],
    'Доход': [
      { name: 'Доходы', icon: '💰' },
    ]
  };
 
  let currentType = 'Расход';
  let selectedCat = null;
  let selectedPayment = 'Карта';
  let tokenClient = null;
  let accessToken = null;
  let localHistory = JSON.parse(localStorage.getItem('budget_history') || '[]');
 
  // ── GOOGLE AUTH ──
  function loadGsi() {
    return new Promise(resolve => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.onload = resolve;
      document.head.appendChild(s);
    });
  }
 
  async function signIn(silent = false) {
    await loadGsi();
    const hint = localStorage.getItem('user_hint') || '';
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      hint: hint,
      callback: async (resp) => {
        if (resp.error) {
          if (silent) return;
          showAuthError('Ошибка входа: ' + resp.error);
          return;
        }
        accessToken = resp.access_token;
        await fetchUserInfo();
      }
    });
    tokenClient.requestAccessToken({ prompt: silent ? 'none' : '' });
  }
 
  async function fetchUserInfo() {
    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if (r.status === 401) { accessToken = null; return; }
    const u = await r.json();
    if (u.email) localStorage.setItem('user_hint', u.email);
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    const av = document.getElementById('user-avatar');
    if (u.picture) {
      av.innerHTML = `<img src="${u.picture}" alt="" />`;
    } else {
      av.textContent = (u.name || 'U')[0].toUpperCase();
    }
    renderCategories();
  }
 
  function signOut() {
    if (!confirm('Выйти из аккаунта?')) return;
    accessToken = null;
    localStorage.removeItem('gtoken');
    localStorage.removeItem('user_hint');
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }
 
  function showAuthError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg; el.style.display = 'block';
  }
 
  // ── UI ──
  function setType(type) {
    currentType = type;
    selectedCat = null;
    document.getElementById('opt-expense').className = 'type-opt' + (type === 'Расход' ? ' active-expense' : '');
    document.getElementById('opt-income').className = 'type-opt' + (type === 'Доход' ? ' active-income' : '');
    const btn = document.getElementById('submit-btn');
    btn.className = 'submit-btn ' + (type === 'Расход' ? 'expense' : 'income');
    btn.textContent = type === 'Расход' ? 'Добавить расход' : 'Добавить доход';
    renderCategories();
  }
 
  function renderCategories() {
    const grid = document.getElementById('cat-grid');
    grid.innerHTML = '';
    (CATEGORIES[currentType] || []).forEach(c => {
      const btn = document.createElement('div');
      btn.className = 'cat-btn' + (selectedCat === c.name ? ' selected' : '');
      btn.innerHTML = `<span class="cat-icon">${c.icon}</span>${c.name}`;
      btn.onclick = () => selectCat(c.name);
      grid.appendChild(btn);
    });
  }
 
  function selectCat(name) {
    selectedCat = name;
    renderCategories();
  }
 
  function setPayment(p) {
    selectedPayment = p;
    document.querySelectorAll('.pay-btn').forEach(b => {
      b.classList.toggle('selected', b.textContent.includes(p.split(' ')[0]) || b.textContent.includes(p));
      b.classList.remove('selected');
    });
    event.currentTarget.classList.add('selected');
  }
 
  function showView(v) {
    document.getElementById('add-view').style.display = v === 'add' ? 'flex' : 'none';
    document.getElementById('history-view').style.display = v === 'history' ? 'flex' : 'none';
    document.getElementById('nav-add').className = 'nav-btn' + (v === 'add' ? ' active' : '');
    document.getElementById('nav-hist').className = 'nav-btn' + (v === 'history' ? ' active' : '');
    if (v === 'history') renderHistory();
  }
 
  // ── SUBMIT ──
  async function submitEntry() {
    const amount = parseFloat(document.getElementById('amount').value);
    if (!amount || amount <= 0) { showToast('Введи сумму', 'error'); return; }
    if (!selectedCat) { showToast('Выбери категорию', 'error'); return; }
 
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Сохраняю...';
 
    const now = new Date();
    const dateSerial = Math.floor((now - new Date(1899,11,30)) / 86400000);
    const month = now.toISOString().slice(0,7);
    const desc = document.getElementById('desc').value.trim();
 
    const row = [dateSerial, currentType, selectedCat, desc, amount, selectedPayment, '', month];
 
    try {
      const res = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/%F0%9F%93%8B%20%D0%A2%D1%80%D0%B0%D0%BD%D0%B7%D0%B0%D0%BA%D1%86%D0%B8%D0%B8:append?valueInputOption=USER_ENTERED`,
        {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ values: [row] })
        }
      );
      if (!res.ok) {
        const e = await res.json();
        // token may be expired — re-auth
        if (res.status === 401) { tokenClient.requestAccessToken(); return; }
        throw new Error(e.error?.message || res.status);
      }
 
      // save local
      localHistory.unshift({ type: currentType, cat: selectedCat, amount, desc, payment: selectedPayment, date: now.toLocaleDateString('ru') });
      if (localHistory.length > 50) localHistory.pop();
      localStorage.setItem('budget_history', JSON.stringify(localHistory));
 
      showToast(`✓ ${currentType} ${amount.toLocaleString('ru')} ₴`, 'success');
      document.getElementById('amount').value = '';
      document.getElementById('desc').value = '';
      selectedCat = null;
      renderCategories();
 
    } catch(e) {
      showToast('Ошибка: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      setType(currentType);
    }
  }
 
  // ── HISTORY ──
  function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    if (!localHistory.length) {
      list.innerHTML = '<div class="history-empty">Пока нет записей</div>';
      document.getElementById('history-count').textContent = '';
      return;
    }
    document.getElementById('history-count').textContent = localHistory.length + ' записей';
    const allCats = Object.values(CATEGORIES).flat();
    localHistory.forEach(h => {
      const catInfo = allCats.find(c => c.name === h.cat) || { icon: '📝' };
      const el = document.createElement('div');
      el.className = 'history-item';
      el.innerHTML = `
        <div class="h-icon">${catInfo.icon}</div>
        <div class="h-info">
          <div class="h-name">${h.desc || h.cat}</div>
          <div class="h-cat">${h.cat} · ${h.date}</div>
        </div>
        <div class="h-amount ${h.type === 'Расход' ? 'exp' : 'inc'}">${h.type === 'Расход' ? '−' : '+'}${h.amount.toLocaleString('ru')} ₴</div>
      `;
      list.appendChild(el);
    });
  }
 
  // ── AUTO LOGIN ──
  window.addEventListener('load', async () => {
    const hint = localStorage.getItem('user_hint');
    if (!hint) return;
    // Try silent token refresh — no popup shown
    await signIn(true);
  });
 
  // ── TOAST ──
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => { t.className = 'toast'; }, 2500);
  }
</script>
</body>
</html>
